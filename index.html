<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
  <h1 class="title">TETRIS</h1>
  <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
    <span>🌙</span><span class="switch"></span><span>☀️</span>
  </button>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="180"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- Records: bloque de game over (formulario de nombre + tabla) -->
        <div id="records-gameover" class="records-block hidden">
          <form id="records-form" class="records-form hidden">
            <label for="records-name">¡Nuevo record! Tu nombre:</label>
            <div class="records-form-row">
              <input id="records-name" type="text" maxlength="12" autocomplete="off" />
              <button id="records-save" type="submit">Guardar</button>
            </div>
          </form>
          <div id="records-table-over"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Records: pantalla de inicio -->
    <div id="records-start" class="overlay">
      <div class="overlay-box">
        <p class="records-heading">RECORDS</p>
        <div id="records-table-start"></div>
        <button id="records-play" class="records-btn">Jugar</button>
        <button id="records-reset" class="records-link" type="button">Resetear records</button>
      </div>
    </div>
  </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
